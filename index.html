<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Document Package</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      max-width: 440px;
      width: 100%;
      padding: 32px;
      text-align: center;
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background-color: #eef2ff;
      color: #4f46e5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }

    .icon-wrapper svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    p {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .file-list {
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .file-item:not(:last-child) {
      border-bottom: 1px solid #f3f4f6;
    }

    .file-name {
      font-weight: 500;
      font-size: 0.9rem;
      color: #374151;
    }

    .single-dl {
      font-size: 0.8rem;
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
    }

    .single-dl:hover {
      text-decoration: underline;
    }

    .btn-primary {
      width: 100%;
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background-color: #4338ca;
    }

    .btn-primary:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </div>

    <h1>Ready for Download</h1>
    <p>Click below to download both design files directly to your device.</p>

    <div class="file-list">
      <div class="file-item">
        <span class="file-name">📄 banner.pdf</span>
        <a href="banner.pdf" download="banner.pdf" class="single-dl">Download</a>
      </div>
      <div class="file-item">
        <span class="file-name">📄 board.pdf</span>
        <a href="board.pdf" download="board.pdf" class="single-dl">Download</a>
      </div>
    </div>

    <button class="btn-primary" onclick="downloadAll()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Download All Files
    </button>
  </div>

  <script>
    function downloadFile(url, filename) {
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
    }

    function downloadAll() {
      // 100ms delay ensures browsers trigger both downloads without blocking
      downloadFile('banner.pdf', 'banner.pdf');
      setTimeout(() => {
        downloadFile('board.pdf', 'board.pdf');
      }, 100);
    }
  </script>

</body>
</html>
